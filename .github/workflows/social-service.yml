name: 🚀 social-service

on:
  push:
    branches: [main]
    paths:
      - "social-service/**"
  pull_request:
    branches: [main]
    paths:
      - "social-service/**"

defaults:
  run:
    working-directory: social-service

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social-service/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Run Biome
        run: npx biome ci .

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social-service/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build
        run: npm run build

  secure:
    name: 🔒 Security
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social-service/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      # - name: 🛡️ Audit dependencies
      #   run: npm audit --audit-level=high

  deploy:
    name: 🚢 Deploy
    runs-on: ubuntu-latest
    needs: [build, secure]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: ⚡ Trigger EasyPanel Deploy
        working-directory: ${{ github.workspace }}
        run: curl --fail -X GET "${{ secrets.EASYPANEL_WEBHOOK_URL }}"

  test-api:
    name: 🧪 API Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: 📬 Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: 🔑 Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: 🚀 Run API tests
        run: |
          postman collection run "47543430-8ed5e0d4-edbe-4b4e-bb62-28dffebd5757" \
            -e "47543430-0702d91a-594c-46ce-8cb6-6082235dc8af" \
             --env-var "dev-hub-api=${{ secrets.API_BASE_URL }}" \
            --reporters junit \
            --reporter-junit-export results.xml

      - name: 📊 Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: social-service/results.xml
          detailed_summary: true

      - name: 📁 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postman-test-results
          path: social-service/results.xml

  performance:
    name: 📈 Performance Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: 📁 Create reports directory
        run: mkdir -p k6/reports

      - name: 🏋️ Run k6
        run: |
          k6 run \
            -e BASE_URL=${{ secrets.API_BASE_URL }} \
            -e USER_ID=${{ secrets.PERF_USER_ID }} \
            -e POST_ID=${{ secrets.PERF_POST_ID }} \
            -e COMMENT_ID=${{ secrets.PERF_COMMENT_ID }} \
            -e TAG_ID=${{ secrets.PERF_TAG_ID }} \
            -e SNIPPET_ID=${{ secrets.PERF_SNIPPET_ID }} \
            -e CI=true \
            k6/performance.js

      - name: 📁 Upload k6 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-performance-report
          path: social-service/k6/reports/
