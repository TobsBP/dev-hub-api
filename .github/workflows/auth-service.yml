name: Java CI

on:
  push:
    branches: ["main"]
    paths: "auth-service/**"
  pull_request:
    branches: ["main"]
    paths: "auth-service/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: auth-service/pom.xml

      - name: Run Unit Tests
        run: mvn test -pl auth-service
        working-directory: .

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: auth-service/pom.xml

      - name: Build JAR (skip tests)
        run: mvn clean package -DskipTests
        working-directory: auth-service

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: auth-service/target/*.jar
          retention-days: 7